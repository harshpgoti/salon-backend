name: backend-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: salon
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: local-dev-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U salon -d salon"
          --health-interval 3s --health-timeout 3s --health-retries 20
      demo-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: salon_demo
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: local-dev-only
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U salon -d salon_demo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DEMO_DATABASE_URL: postgresql+psycopg://salon_app:local-dev-only@127.0.0.1:5435/salon_demo
      DATABASE_URL: postgresql+psycopg://salon_app:local-dev-only@127.0.0.1:5432/salon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install --constraint constraints.txt '.[test]'
      - name: Check exact tested dependencies
        run: |
          python -m pip check
          python scripts/check_dependency_lock.py
      - name: Apply every migration to the fresh synthetic database
        env:
          PGPASSWORD: local-dev-only
        run: |
          for migration in db/migrations/*.sql; do
            psql -h 127.0.0.1 -U salon -d salon -v ON_ERROR_STOP=1 -f "$migration"
          done
          for migration in db/migrations/*.sql; do
            psql -h 127.0.0.1 -p 5435 -U salon -d salon_demo -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify non-owner runtime role
        run: python scripts/check_database.py
      - run: python -m pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-test-results
          path: test-results.xml
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --tag salon-api:ci .
  infra-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Terraform with checksum verification
        run: |
          curl --fail --silent --show-error --location https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip -o /tmp/terraform.zip
          echo '2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4  /tmp/terraform.zip' | sha256sum --check --status
          unzip -q /tmp/terraform.zip -d /tmp/terraform
          echo /tmp/terraform >> "$GITHUB_PATH"
      - name: Validate each isolated environment root
        run: |
          terraform fmt -check -recursive infra
          for env in infra/envs/staging infra/envs/prod; do
            terraform -chdir="$env" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$env" validate
          done
