[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "salon-api"
version = "0.1.0"
description = "Tenant-safe salon operations API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "SQLAlchemy==2.0.52",
  "psycopg[binary]==3.3.4", "alembic==1.19.1", "httpx==0.28.1", "tzdata==2026.5", "PyJWT[crypto]==2.15.1", "cryptography==50.0.2",
]
[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["modules*", "salon_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

