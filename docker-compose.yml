name: salon

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: salon
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - salon-postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U salon -d salon"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  salon-postgres:
